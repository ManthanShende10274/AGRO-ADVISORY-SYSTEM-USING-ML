<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Advisory</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
    }

    header {
      background: white;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    header img {
      height: 50px;
      border-radius: 8px;
    }

    .logo-title h1 {
      font-size: 20px;
      color: #2E7D32;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #2E7D32;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      animation: slideIn 0.8s ease-out
    }

    @keyframes slideIn {
      0% {
        transform: translateY(50px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .left-section {
      flex: 1;
      padding-right: 30px;
    }

    .left-section img {
      width: 100%;
      border-radius: 20px;
      object-fit: cover;
    }

    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    h2 {
      font-size: 28px;
      font-weight: 700;
      color: #2c3e50;
    }

    label {
      font-weight: 500;
      font-size: 16px;
      margin-bottom: 5px;
      display: block;
    }

    input[type="text"] {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
    }

    button:hover {
      background-color: #219150;
    }

    .result {
      margin-top: 10px;
      padding: 15px;
      background-color: #ecf9f1;
      border-left: 6px solid #27ae60;
      border-radius: 10px;
      font-size: 16px;
    }

    @media screen and (max-width: 900px) {
      .container {
        flex-direction: column;
        padding: 20px;
        margin: 20px;
      }

      .left-section, .right-section {
        width: 100%;
        padding: 0;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header with Logo and Navigation -->
  <header>
    <div class="logo-title">
      <img src="assets/logo.jpg" alt="Logo" />
      <h1>Agro Advisory System using ML</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="crop.html">Crop Disease</a>
      <a href="fertilizer.html">Fertilizer</a>
      <a href="weather.html">Weather</a>
    </nav>
  </header>

  <!-- Weather Container -->
  <div class="container">
    <div class="left-section">
      <img src="assets/weather.jpg" alt="Farm Image" />
    </div>

    <div class="right-section">
      <h2>Weather Advice System</h2>
      <form id="weatherForm">
        <div class="form-group">
          <label for="city">Enter City:</label>
          <input type="text" id="city" name="city" placeholder="e.g., Nagpur">
        </div>
        <div class="form-group">
          <button type="submit">Get Weather Advice</button>
        </div>
      </form>

      <div class="result" id="weatherResult" style="display: none;"></div>
    </div>
  </div>

  <script>
  document.getElementById('weatherForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const city = document.getElementById('city').value.trim();
    const result = document.getElementById('weatherResult');

    if (city === '') {
      result.style.display = 'block';
      result.innerHTML = "Please enter a valid city name.";
      return;
    }

    result.style.display = 'block';
    result.innerHTML = "⏳ Fetching weather data...";

    try {
      const apiKey = '2ea4593d7893e364ac670034c9b16246';
      const response = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
      );

      if (!response.ok) {
        throw new Error("City not found or API error");
      }

      const data = await response.json();
      const weather = data.weather[0].description;
      const temp = data.main.temp;
      const humidity = data.main.humidity;

      // Simple farming advice based on weather
      let farmingAdvice = '';
      if (weather.includes('rain') || humidity > 80) {
        farmingAdvice = `
          - 🌧️ Avoid irrigation for 2 days due to expected rainfall.<br>
          - 🌾 Ensure proper drainage in crop fields.<br>
          - 🐛 Delay pesticide spraying.
        `;
      } else if (temp > 35) {
        farmingAdvice = `
          - ☀️ High temperatures detected. Irrigate during early morning or evening.<br>
          - 🌿 Apply mulch to reduce evaporation.<br>
          - 🚰 Monitor water stress in crops.
        `;
      } else {
        farmingAdvice = `
          - ✅ Suitable conditions for pesticide application.<br>
          - 💧 Normal irrigation recommended.<br>
          - 🧪 Fertilizer application can be considered.
        `;
      }

      result.innerHTML = `
        <strong>Weather Report for ${city}:</strong><br>
        🌤️ ${weather}, ${temp}°C, Humidity: ${humidity}%<br><br>
        🌱 <strong>Farming Advice:</strong><br>
        ${farmingAdvice}
      `;
    } catch (error) {
      result.innerHTML = "❌ Could not fetch weather data. Please check the city name.";
    }
  });
</script>



</body>
</html>
